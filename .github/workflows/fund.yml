name: fund-snapshot

# 公募基金快照（收益版）。
# 说明：这份产物只含代码/简称/净值/阶段涨幅/成立日/手续费，不含规模与基金经理
# （那两项要逐只抓，见 scripts/fund.mjs 顶部注释，作为第二阶段补）。
# 基金净值一般 20:00 后才全部更新完，这里先放在 16:50 跑，主要是保证链路可用。

on:
  schedule:
    # 50 8 UTC = 16:50 北京时间
    - cron: "50 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # data 分支是「每次全量重写」的，所以必须先把已有的 a/hk 产物取下来，
      # 否则这次推送会把股票快照一起冲掉。
      - name: 取出已有的 data 分支产物
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            for f in a.json a.json.gz hk.json hk.json.gz fund.json fund.json.gz; do
              git show "FETCH_HEAD:$f" > "out/$f" 2>/dev/null || rm -f "out/$f"
            done
            echo "已带回：$(ls -1 out | tr '\n' ' ')"
          else
            echo "data 分支还不存在，本次只产出 fund"
          fi

      - name: 生成基金快照
        env:
          SNAPSHOT_DIR: out
        run: node scripts/fund.mjs --probe

      - name: 校验产物
        run: |
          set -e
          node -e "const d=require('./out/fund.json'); if(!d.rows||!d.rows.length){console.error('fund.json 没有数据');process.exit(1)} const bad=d.rows.filter(r=>!/^\\d{6}$/.test(r.c)).length; if(bad){console.error('有 '+bad+' 条代码不合法');process.exit(1)} console.log('fund.json ok', d.rows.length, '只')"
          head -c 2 out/fund.json.gz | od -An -tx1 | grep -q "1f 8b" && echo "fund.json.gz gzip ok"

      - name: 推送 data 分支
        run: |
          set -e
          cd out
          git init -q -b data
          git config user.name "guxi-snapshot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data:data
          echo "pushed $(ls -1 | tr '\n' ' ')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
