name: fundgaps

# 查漏报告：统计缺失规模 / 经理 / 收益的分布，判断哪些能补、哪些是源站本来就没有。

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fundgaps.mjs"
      - ".github/workflows/fundgaps.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 取出已有的 data 分支产物
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            for f in fundrank.json funddetail.json fundmgr.json managers.json mgrmap.json; do
              git show "FETCH_HEAD:$f" > "out/$f" 2>/dev/null || rm -f "out/$f"
            done
            echo "已带回：$(ls -1 out | tr '\n' ' ')"
          fi

      - name: 生成缺口报告
        env:
          SNAPSHOT_DIR: out
        run: node scripts/fundgaps.mjs

      - name: 推送 data 分支
        run: bash scripts/pushdata.sh gapreport.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
