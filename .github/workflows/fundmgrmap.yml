name: fundmgrmap

# 经理「姓名 → id」映射（用 /fundSearch?m=7 反查）。
#
# 已停用自动运行。2026-11-25 起 mgrmap 由 fundmeta 顺带产出
# （F10 概况页的经理链接里直接带 id，不用再反查），且增量合并、只增不减。
# 保留 workflow_dispatch 仅作应急兜底，不要再加回 schedule。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 反查是串行第三方接口，4000 个姓名单轮就要 20~30 分钟，所以 timeout 放到 60。
    timeout-minutes: 60
    env:
      MAP_LIMIT: "4000"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 取出已有的 data 分支产物
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            for f in a.json hk.json fund.json fundmeta.json fundrank.json funddetail.json mgrmap.json managers.json fundmgr.json fundapi_probe.json; do
              git show "FETCH_HEAD:$f" > "out/$f" 2>/dev/null || rm -f "out/$f"
            done
            echo "已带回：$(ls -1 out | tr '\n' ' ')"
          fi

      - name: 反查经理 id
        env:
          SNAPSHOT_DIR: out
        run: node scripts/fundmgrmap.mjs --limit "$MAP_LIMIT"

      - name: 校验产物
        run: |
          set -e
          node -e "
            const d=require('./out/mgrmap.json');
            const rows=(d.rows||[]).filter(r=>r.id);
            if(!rows.length){console.error('一条映射都没命中');process.exit(1)}
            const exact=rows.filter(r=>r.exact).length;
            const dup=rows.filter(r=>r.dup>1).length;
            console.log('映射', d.count, '/', d.totalNames, '| 精确', exact, '| 同名多人', dup);
            if(rows.length/Math.max(d.totalNames,1) < 0.5){console.error('命中率过低');process.exit(1)}
          "

      - name: 推送 data 分支
        run: bash scripts/pushdata.sh mgrmap.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
