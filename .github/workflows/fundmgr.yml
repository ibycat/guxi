name: fundmgr

# 基金经理抓取（从业年限 / 在管规模 / 任职天数）。
# 依赖 fundmeta.json 里的经理 id 列表，所以要在 fundmeta 之后跑。
# 先用 MGR_LIMIT=20 验证解析，确认无误再调大。

on:
  schedule:
    # 每天一批（UTC 05:10 = 北京 13:10）。必须排在 fundmgrmap（02:40）之后，
    # 因为它依赖 mgrmap.json；之前排 03:00 时反查还没跑完，导致拿不到经理 id 直接失败。
    - cron: "10 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fundmgr.mjs"
      - ".github/workflows/fundmgr.yml"

permissions:
  contents: write

# 多个 run 同时 force push 同一个 data 分支会互相覆盖，
# 用同一 group 串行化；不取消进行中的任务，避免半途中断
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MGR_LIMIT: "600"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 取出已有的 data 分支产物
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            for f in a.json hk.json fund.json fundmeta.json mgrmap.json managers.json fundmgr.json; do
              git show "FETCH_HEAD:$f" > "out/$f" 2>/dev/null || rm -f "out/$f"
            done
            echo "已带回：$(ls -1 out | tr '\n' ' ')"
          fi

      - name: 抓取基金经理
        env:
          SNAPSHOT_DIR: out
        run: node scripts/fundmgr.mjs --limit "$MGR_LIMIT"

      - name: 校验产物
        run: |
          set -e
          node -e "
            const m=require('./out/managers.json');
            const f=require('./out/fundmgr.json');
            const rows=(m.rows||[]).filter(r=>!r.err);
            if(!rows.length){console.error('经理数据为空');process.exit(1)}
            const noAum=rows.filter(r=>r.aum==null).length;
            const noY=rows.filter(r=>r.y==null).length;
            const noFund=rows.filter(r=>!r.funds||!r.funds.length).length;
            console.log('经理', rows.length, '| 缺在管规模', noAum, '| 缺从业年限', noY, '| 无关联基金', noFund, '| 基金维度', f.count);
            if(noAum/rows.length>0.3||noY/rows.length>0.3){console.error('关键字段空值率过高');process.exit(1)}
            if(!f.count){console.error('fundmgr.json 为空 —— 基金链接解析可能失效');process.exit(1)}
          "

      - name: 推送 data 分支
        run: bash scripts/pushdata.sh managers.json fundmgr.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
