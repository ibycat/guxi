name: funddetail

# 基金详情批量抓取（第三方 API）：全称 / 经理 / 成立日 / 规模 / 业绩基准 / 跟踪指数。
#
# 已停用自动运行。2026-11-25 起详情改由 fundmeta（东财 F10 概况页）产出，
# 它同样是「全称/规模/经理(含 id)/成立日/基准/跟踪标的」，并且没有外部依赖。
# 这里保留 workflow_dispatch 只为应急：万一东财解析失效，可手动跑一次顶住。
# 不要再加回 schedule —— 否则会用 2.5 万只（含清盘/未成立份额）覆盖东财的 2 万只存续基金。

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 每个 workflow 自己的组：只防止自身重复触发，不与别的 workflow 互相顶掉排队任务
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      # 剩余约 1.3 万只，一轮抓完；跑满后这里留 3000 做每日增量
      DETAIL_LIMIT: "20000"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 取出已有的 data 分支产物
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            for f in a.json hk.json fund.json fundmeta.json fundrank.json funddetail.json managers.json fundmgr.json fundapi_probe.json; do
              git show "FETCH_HEAD:$f" > "out/$f" 2>/dev/null || rm -f "out/$f"
            done
            echo "已带回：$(ls -1 out | tr '\n' ' ')"
          fi

      - name: 抓取基金详情
        env:
          SNAPSHOT_DIR: out
        run: node scripts/funddetail.mjs --limit "$DETAIL_LIMIT"

      - name: 校验产物
        run: |
          set -e
          node -e "
            const d=require('./out/funddetail.json');
            const rows=(d.rows||[]).filter(r=>!r.err);
            if(!rows.length){console.error('没有成功记录');process.exit(1)}
            const noFull=rows.filter(r=>!r.full).length;
            const noScale=rows.filter(r=>r.s==null).length;
            const noJj=rows.filter(r=>!r.jj).length;
            const multi=rows.filter(r=>r.gn>1).length;
            console.log('覆盖', d.count, '/', d.total, '| 缺全称', noFull, '| 缺规模', noScale, '| 缺经理', noJj, '| 有合并份额的基金', multi);
            if(noFull/rows.length>0.2){console.error('全称缺失过多，解析可能失效');process.exit(1)}
            if(noScale/rows.length>0.5){console.error('规模缺失过多');process.exit(1)}
          "

      - name: 推送 data 分支
        run: bash scripts/pushdata.sh funddetail.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
