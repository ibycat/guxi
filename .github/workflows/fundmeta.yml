name: fundmeta

# 基金元信息（规模 / 经理 / 跟踪标的）抓取。
# 需要逐只访问 F10 概况页，量大，所以支持 --limit 分批：
#   首次用 300 只验证解析，确认无误后再改 META_LIMIT 逐步放大。
# 规模来自季报，一季度才变一次，不需要每天全量。
#
# 已降级为「手动兜底」：只保留 workflow_dispatch，不再有 schedule / push 触发。
# 原因：fundmeta 逐只爬东财 F10 页面，速度和稳定性都不如第三方 funddetail；
#       经理 id 也已改由 mgrmap 提供。保留它只为必要时手动跑一次。
# 发布统一走 scripts/pushdata.sh（clone 最新 data 分支 + 覆盖 + 普通 push），
# 不再 force push，避免把 fundrank / funddetail 等他人产物冲掉。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 每批抓多少只；0 = 一次抓完（会超时，别用）
      META_LIMIT: "3000"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 抓取脚本会读已有产物做增量，先把 data 分支上的文件取下来
      - name: 取出已有的 data 分支产物
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            for f in a.json hk.json fund.json fundmeta.json; do
              git show "FETCH_HEAD:$f" > "out/$f" 2>/dev/null || rm -f "out/$f"
            done
            echo "已带回：$(ls -1 out | tr '\n' ' ')"
          else
            echo "data 分支还不存在"
          fi

      - name: 抓取基金元信息
        env:
          SNAPSHOT_DIR: out
        run: node scripts/fundmeta.mjs --limit "$META_LIMIT"

      - name: 校验产物
        run: |
          set -e
          node -e "
            const d=require('./out/fundmeta.json');
            const rows=(d.rows||[]).filter(r=>!r.err);
            if(!rows.length){console.error('没有成功记录');process.exit(1)}
            const missFull=rows.filter(r=>!r.full).length;
            const missScale=rows.filter(r=>r.s==null).length;
            const missMgr=rows.filter(r=>!r.mgr||!r.mgr.length).length;
            console.log('ok', rows.length, '条 | 缺全称', missFull, '缺规模', missScale, '缺经理', missMgr);
            if(missFull/rows.length>0.2||missScale/rows.length>0.3){console.error('关键字段空值率过高，解析可能失效');process.exit(1)}
          "

      - name: 推送 data 分支
        run: bash scripts/pushdata.sh out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
