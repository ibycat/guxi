name: snapshot

on:
  schedule:
    # 每天只跑两次，抓的是「收盘后的静态数据」，不是为了追实时行情。
    # 08:10 UTC = 16:10 北京时间（收盘后半小时，拿到当日收盘）
    # 23:35 UTC = 07:35 北京时间（次日开盘前兜底重试，此时 f2 仍是上一交易日收盘）
    - cron: "10 8 * * *"
    - cron: "35 23 * * *"
  workflow_dispatch:
  # 改本文件或抓取脚本时自动跑一次，用来验证改动（cron 漂移太大，不能靠定时验证）
  push:
    paths:
      - ".github/workflows/snapshot.yml"
      - "scripts/snapshot.mjs"
      - "scripts/snapshot-qq.mjs"

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 先把上一次的产物取到 prev/：某个市场这次抓失败时，再回填，避免丢掉
      - name: 备份上一次快照
        run: |
          mkdir -p prev out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            for f in a.json hk.json; do
              git show "FETCH_HEAD:$f" > "prev/$f" 2>/dev/null || rm -f "prev/$f"
            done
            ls -lh prev/ || true
          else
            echo "data 分支还不存在，本次全量生成"
          fi

      # 抓取失败不该让整个流程变红：东财对 GitHub 出口 IP 有风控，
      # 偶发 502 或部分页拿不到是常态。这里允许失败，后面回填上一份快照继续发布，
      # 页面上本来就有「数据已 N 天未更新」的提示，不会让人误当当天行情。
      # 东财对 Cloudflare 出口是「短窗口限流」：本机能单发 200，Runner 连续抓时整片 502，
      # 几分钟后又自己恢复。所以探测不能一次定生死 —— 3 轮、每轮直连一次 + 代理两次，
      # 轮间等 30 秒，最多约 4 分钟。只有 6 次全挂才判不可用、直接走腾讯兜底。
      - name: 探测东财是否可用
        id: probe
        run: |
          target="https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=1&po=0&np=1&fltt=2&invt=2&fid=f12&fs=m:0+t:6&fields=f12"
          enc=$(printf %s "$target" | jq -sRr @uri)
          blocked=true
          proxy=""
          for round in 1 2 3; do
            code=$(curl -s -m 10 -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" "$target" || echo 000)
            echo "第 $round 轮 直连返回 $code"
            if [ "$code" = "200" ]; then
              blocked=false
              break
            fi
            # 直连不行不代表源站不行：Runner 出口在境外，东财常按 IP 拦。
            # 改走本站 /api/em 的边缘代理（Cloudflare 出口），通了就照常抓全量分红。
            # 代理偶发 502（边缘函数瞬时抖动），单次失败不算数，每轮给它两次机会。
            pcode=""
            for attempt in 1 2; do
              pcode=$(curl -s -m 20 -o /dev/null -w "%{http_code}" "https://guxi-6em.pages.dev/api/em?u=$enc" || echo 000)
              echo "第 $round 轮 代理第 $attempt 次返回 $pcode"
              [ "$pcode" = "200" ] && break
              sleep 3
            done
            if [ "$pcode" = "200" ]; then
              blocked=false
              proxy="https://guxi-6em.pages.dev/api/em"
              break
            fi
            [ "$round" -lt 3 ] && sleep 30
          done
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"
          echo "proxy=$proxy" >> "$GITHUB_OUTPUT"
          if [ "$blocked" = "false" ]; then
            if [ -n "$proxy" ]; then
              echo "东财直连不可用，改走边缘代理抓取" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "东财直连可用" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "东财直连与代理 3 轮 6 次均不可用，本轮走腾讯兜底" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 生成快照
        id: snap
        if: steps.probe.outputs.blocked == 'false'
        continue-on-error: true
        timeout-minutes: 16
        env:
          SNAPSHOT_DIR: out
          SNAPSHOT_PROXY: ${{ steps.probe.outputs.proxy }}
        run: |
          set -o pipefail
          node scripts/snapshot.mjs 2>&1 | tee snap.log

      # 失败后立即重试一次：风控多为短时窗口，隔 45 秒换一组镜像往往就过了
      - name: 生成失败时重试一次
        if: steps.snap.outcome == 'failure'
        id: snap2
        continue-on-error: true
        timeout-minutes: 6
        env:
          SNAPSHOT_DIR: out
          # 第一次已经失败过一次，重试直接吃代理，不再赌直连
          SNAPSHOT_PROXY: ${{ steps.probe.outputs.proxy || 'https://guxi-6em.pages.dev/api/em' }}
        run: |
          set -o pipefail
          echo "第一次抓取失败，45 秒后重试" >> "$GITHUB_STEP_SUMMARY"
          sleep 45
          node scripts/snapshot.mjs 2>&1 | tee -a snap.log

      # 把失败原因写进 run summary，不用登进去翻日志
      - name: 记录失败原因
        if: steps.snap.outcome == 'failure'
        run: |
          echo "## 抓取失败" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "Error|error|失败|严重缺失|http_|timeout" snap.log 2>/dev/null | tail -20 >> "$GITHUB_STEP_SUMMARY" || tail -20 snap.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 东财对 GitHub Runner 出口 IP 整体封禁时（push2 全程 302/502），
      # 用腾讯行情补价格：只换价格源，行业/上市日沿用上一份快照，
      # 股息率按「旧价/新价」比例换算，输出格式与主脚本一致。
      - name: 行情兜底（腾讯行情，A 股与港股）
        if: always()
        continue-on-error: true
        env:
          SNAPSHOT_DIR: out
          PREV_DIR: prev
        run: |
          need=""
          [ -s out/a.json ] || need="a"
          if [ ! -s out/hk.json ]; then
            if [ -z "$need" ]; then need="hk"; else need="both"; fi
          fi
          if [ -z "$need" ]; then
            echo "两个市场都已生成，跳过兜底"
            exit 0
          fi
          echo "需要兜底：$need"
          node scripts/snapshot-qq.mjs --market "$need" 2>&1 | tee -a snap.log

      # 本轮没产出的市场，用上一次的文件顶上（只有 out/ 里确实没有才回填）
      # if: always() —— 上一步失败也要跑，否则失败的 run 会连上一份快照都发不出去
      - name: 回填上次产物
        if: always()
        run: |
          set -e
          for b in a hk; do
            if [ -s "out/$b.json" ]; then
              echo "本轮已生成 $b"
            elif [ -s "prev/$b.json" ]; then
              cp "prev/$b.json" "out/$b.json"
              echo "本轮 $b 失败，沿用上一次的副本"
            fi
            if [ -s "out/$b.json" ]; then
              echo "OK $b.json $(wc -c < "out/$b.json") bytes"
            fi
          done

          # 两个都没有才算失败
          test -s out/a.json || test -s out/hk.json

      - name: 校验产物是合法 JSON
        id: validate
        if: always()
        run: |
          set -e
          # 两个文件都不存在时，下面的循环会全部 continue 并以 0 退出，校验就变成空转通过。
          # 这里先硬断言至少有一个产物。
          [ -s out/a.json ] || [ -s out/hk.json ] || { echo "没有任何快照产物（out/a.json 与 out/hk.json 都不存在）"; exit 1; }
          for f in out/a.json out/hk.json; do
            [ -s "$f" ] || continue
            node -e "const d=require('./$f'); const n = d.rows ? d.rows.length : (d.code ? d.code.split('|').filter(Boolean).length : 0); if(!n) { console.error('$f 没有数据'); process.exit(1) } console.log('$f ok', n, '行, 版本', d.v || 1)"
          done
          # 行数环比：残缺血本不该走到这一步，但兜底/回填都可能顶上一份小文件，
          # 这里再拦一次，跌超 10% 直接判校验失败（连带跳过推送）。
          for b in a hk; do
            [ -s "out/$b.json" ] || continue
            [ -s "prev/$b.json" ] || continue
            node -e "
              const cur = require('./out/$b.json'), prev = require('./prev/$b.json');
              const n = (d) => d.code ? String(d.code).split('|').filter(Boolean).length : (d.rows ? d.rows.length : 0);
              const c = n(cur), p = n(prev);
              console.log('$b 环比 ' + p + ' → ' + c);
              if (p && c < p * 0.9) { console.error('$b 行数回退 ' + p + ' → ' + c + '，拒绝发布'); process.exit(1); }
            "
          done

      # 只有校验通过才推送。原来这里是 if: always()，校验失败照样把半截 JSON 推上分支，
      # 而下一轮的 prev 就是那份坏文件，坏数据会被一直继承下去。
      - name: 推送到 data 分支（安全合并推送，不污染 main 历史）
        if: always() && steps.validate.outcome == 'success'
        run: bash scripts/pushdata.sh a.json hk.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
