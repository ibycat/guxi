name: snapshot

on:
  schedule:
    # 每天只跑两次，抓的是「收盘后的静态数据」，不是为了追实时行情。
    # 08:10 UTC = 16:10 北京时间（收盘后半小时，拿到当日收盘）
    # 23:35 UTC = 07:35 北京时间（次日开盘前兜底重试，此时 f2 仍是上一交易日收盘）
    - cron: "10 8 * * *"
    - cron: "35 23 * * *"
  workflow_dispatch:
  # 改本文件时自动跑一次，用来验证改动（cron 漂移太大，不能靠定时验证）
  push:
    paths:
      - ".github/workflows/snapshot.yml"

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 先把上一次的产物取到 prev/：某个市场这次抓失败时，再回填，避免丢掉
      - name: 备份上一次快照
        run: |
          mkdir -p prev out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            for f in a.json hk.json; do
              git show "FETCH_HEAD:$f" > "prev/$f" 2>/dev/null || rm -f "prev/$f"
            done
            ls -lh prev/ || true
          else
            echo "data 分支还不存在，本次全量生成"
          fi

      # 抓取失败不该让整个流程变红：东财对 GitHub 出口 IP 有风控，
      # 偶发 502 或部分页拿不到是常态。这里允许失败，后面回填上一份快照继续发布，
      # 页面上本来就有「数据已 N 天未更新」的提示，不会让人误当当天行情。
      # 先花 8 秒探一下 push2 通不通。东财封 GitHub 出口时，主脚本要跑满 16 分钟
      # 超时才失败，再重试 6 分钟，白白浪费 22 分钟才轮到兜底。
      - name: 探测东财是否可用
        id: probe
        run: |
          code=$(curl -s -m 8 -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" \
            "https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=1&po=0&np=1&fltt=2&invt=2&fid=f12&fs=m:0+t:6&fields=f12" || echo 000)
          echo "push2 返回 $code"
          if [ "$code" = "200" ]; then
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          else
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "东财行情接口不可用（$code），本轮直接走腾讯兜底" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 生成快照
        id: snap
        if: steps.probe.outputs.blocked == 'false'
        continue-on-error: true
        timeout-minutes: 16
        env:
          SNAPSHOT_DIR: out
        run: |
          set -o pipefail
          node scripts/snapshot.mjs 2>&1 | tee snap.log

      # 失败后立即重试一次：风控多为短时窗口，隔 45 秒换一组镜像往往就过了
      - name: 生成失败时重试一次
        if: steps.snap.outcome == 'failure'
        id: snap2
        continue-on-error: true
        timeout-minutes: 6
        env:
          SNAPSHOT_DIR: out
        run: |
          set -o pipefail
          echo "第一次抓取失败，45 秒后重试" >> "$GITHUB_STEP_SUMMARY"
          sleep 45
          node scripts/snapshot.mjs 2>&1 | tee -a snap.log

      # 把失败原因写进 run summary，不用登进去翻日志
      - name: 记录失败原因
        if: steps.snap.outcome == 'failure'
        run: |
          echo "## 抓取失败" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "Error|error|失败|严重缺失|http_|timeout" snap.log 2>/dev/null | tail -20 >> "$GITHUB_STEP_SUMMARY" || tail -20 snap.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # 东财对 GitHub Runner 出口 IP 整体封禁时（push2 全程 502），
      # 用腾讯行情补价格：只换价格源，行业/上市日沿用上一份快照，
      # 股息率按「旧价/新价」比例换算，输出格式与主脚本一致。
      - name: A 股兜底（腾讯行情）
        if: always()
        continue-on-error: true
        env:
          SNAPSHOT_DIR: out
          PREV_DIR: prev
        run: |
          if [ -s out/a.json ]; then
            echo "本轮 A 股已生成，跳过兜底"
            exit 0
          fi
          echo "A 股未生成，启用腾讯行情兜底"
          node scripts/snapshot-qq.mjs 2>&1 | tee -a snap.log

      # 本轮没产出的市场，用上一次的文件顶上（只有 out/ 里确实没有才回填）
      # if: always() —— 上一步失败也要跑，否则失败的 run 会连上一份快照都发不出去
      - name: 回填上次产物
        if: always()
        run: |
          set -e
          for b in a hk; do
            if [ -s "out/$b.json" ]; then
              echo "本轮已生成 $b"
            elif [ -s "prev/$b.json" ]; then
              cp "prev/$b.json" "out/$b.json"
              # 旧副本可能没有预压缩版本，先一并带过来
              [ -s "prev/$b.json.gz" ] && cp "prev/$b.json.gz" "out/$b.json.gz"
              echo "本轮 $b 失败，沿用上一次的副本"
            fi
          done

          # 保证每个存在的快照都有预压缩版本：
          # /api/snap 只做字节透传，没有 .gz 就只能现场压缩（会吃 CPU），
          # 所以这里兜底补生成一次，旧产物也能立刻享受零压缩开销。
          for b in a hk; do
            if [ -s "out/$b.json" ] && [ ! -s "out/$b.json.gz" ]; then
              gzip -9 -n -c "out/$b.json" > "out/$b.json.gz"
              echo "补生成 $b.json.gz"
            fi
            if [ -s "out/$b.json" ]; then
              echo "OK $b.json $(wc -c < "out/$b.json") bytes → gz $(wc -c < "out/$b.json.gz" 2>/dev/null || echo 0) bytes"
            fi
          done

          # 两个都没有才算失败
          test -s out/a.json || test -s out/hk.json

      - name: 校验产物是合法 JSON
        if: always()
        run: |
          set -e
          for f in out/a.json out/hk.json; do
            [ -s "$f" ] || continue
            node -e "const d=require('./$f'); const n = d.rows ? d.rows.length : (d.code ? d.code.split('|').filter(Boolean).length : 0); if(!n) { console.error('$f 没有数据'); process.exit(1) } console.log('$f ok', n, '行, 版本', d.v || 1)"
          done
          # 预压缩产物必须是合法 gzip（魔术字节 1f 8b）
          for g in out/a.json.gz out/hk.json.gz; do
            [ -s "$g" ] || continue
            head -c 2 "$g" | od -An -tx1 | grep -q "1f 8b" && echo "$g gzip ok" || { echo "$g 不是合法 gzip"; exit 1; }
          done

      - name: 推送到 data 分支（安全合并推送，不污染 main 历史）
        if: always()
        run: bash scripts/pushdata.sh a.json hk.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
