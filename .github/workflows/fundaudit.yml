name: fundaudit

# 收益数据审计：按规则筛可疑行，再与东财 pingzhongdata 的 syl_1n 交叉核对。

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fundaudit.mjs"
      - ".github/workflows/fundaudit.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 取出 fundrank
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git show "FETCH_HEAD:fundrank.json" > "out/fundrank.json" 2>/dev/null || rm -f "out/fundrank.json"
            echo "已带回：$(ls -1 out | tr '\n' ' ')"
          fi

      - name: 审计
        env:
          SNAPSHOT_DIR: out
        run: node scripts/fundaudit.mjs

      - name: 推送 data 分支
        run: bash scripts/pushdata.sh audit.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
