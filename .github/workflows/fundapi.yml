name: fundapi

# 第三方天天基金 API 探测。
# 目标机是纯 HTTP，本地/浏览器工具都会被强制升级成 HTTPS 打不通，
# 所以在这里跑，产物 fundapi_probe.json 推到 data 分支供人工核对字段。

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fundapi.mjs"
      - ".github/workflows/fundapi.yml"

permissions:
  contents: write

# 和 fundmeta / fundmgr 共用同一个写锁，避免 force push 互相覆盖
concurrency:
  group: data-branch-writer
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 取出已有的 data 分支产物
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            for f in a.json hk.json fund.json fundmeta.json managers.json fundmgr.json fundapi_probe.json; do
              git show "FETCH_HEAD:$f" > "out/$f" 2>/dev/null || rm -f "out/$f"
            done
            echo "已带回：$(ls -1 out | tr '\n' ' ')"
          fi

      - name: 探测接口
        env:
          SNAPSHOT_DIR: out
        run: node scripts/fundapi.mjs

      - name: 推送 data 分支
        run: |
          set -e
          cd out
          git init -q -b data
          git config user.name "guxi-snapshot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data:data
          echo "pushed $(ls -1 | tr '\n' ' ')"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
