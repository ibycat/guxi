name: fundrank

# 从第三方天天基金 API 拉全市场排行（收益 + 规模）。
# 约 850 页 × 30 条，4 并发，几分钟跑完 —— 比逐只爬 F10 快得多。

on:
  schedule:
    # 每天 09:40 北京（01:40 UTC），排在股票快照之后
    - cron: "40 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fundrank.mjs"
      - ".github/workflows/fundrank.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 取出已有的 data 分支产物
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            for f in a.json hk.json fund.json fundmeta.json managers.json fundmgr.json fundrank.json fundapi_probe.json; do
              git show "FETCH_HEAD:$f" > "out/$f" 2>/dev/null || rm -f "out/$f"
            done
            echo "已带回：$(ls -1 out | tr '\n' ' ')"
          fi

      - name: 拉取排行
        env:
          SNAPSHOT_DIR: out
          PAGES: "0"
        run: node scripts/fundrank.mjs --pages "$PAGES"

      - name: 校验产物
        run: |
          set -e
          node -e "
            const d=require('./out/fundrank.json');
            const rows=d.rows||[];
            if(rows.length<1000){console.error('行数过少：'+rows.length);process.exit(1)}
            const noScale=rows.filter(r=>r.nav2==null).length;
            const noY1=rows.filter(r=>r.y1==null).length;
            console.log('ok', rows.length, '只 | 缺规模', noScale, '| 缺近1年', noY1);
            if(noScale/rows.length>0.3){console.error('规模字段缺失过多，解析可能失效');process.exit(1)}
          "

      - name: 推送 data 分支
        run: bash scripts/pushdata.sh out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
