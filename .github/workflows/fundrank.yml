name: fundrank

# 全市场基金排行（东财 rankhandler，每页 5000 条，5 页左右）。
# 只取收益与净值；规模/经理/成立日由 fundmeta 从 F10 概况页提供。

on:
  schedule:
    # 每天 09:40 北京（01:40 UTC），排在股票快照之后
    - cron: "40 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/fundrank.mjs"
      - ".github/workflows/fundrank.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 取出已有的 data 分支产物
        run: |
          mkdir -p out
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            for f in a.json hk.json fund.json fundmeta.json managers.json fundmgr.json fundrank.json fundapi_probe.json; do
              git show "FETCH_HEAD:$f" > "out/$f" 2>/dev/null || rm -f "out/$f"
            done
            echo "已带回：$(ls -1 out | tr '\n' ' ')"
          fi

      - name: 拉取排行
        env:
          SNAPSHOT_DIR: out
          PAGES: "0"
        run: node scripts/fundrank.mjs --pages "$PAGES"

      - name: 校验产物
        run: |
          set -e
          node -e "
            const d=require('./out/fundrank.json');
            const rows=d.rows||[];
            if(rows.length<1000){console.error('行数过少：'+rows.length);process.exit(1)}
            if(d.mode!=='full'){console.error('未取全：'+d.count+'/'+d.total);process.exit(1)}
            const noY1=rows.filter(r=>r.y1==null).length;
            const noNav=rows.filter(r=>r.nav==null).length;
            console.log('ok', rows.length, '只 | 缺净值', noNav, '| 缺近1年', noY1);
            // 解析失效时最典型的信号是净值全空，这里卡 30%
            if(noNav/rows.length>0.3){console.error('净值为空过多，解析可能失效');process.exit(1)}
          "

      - name: 推送 data 分支
        run: bash scripts/pushdata.sh fundrank.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
